<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fuerza en casa</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1b6a7a"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f4f1;--fg:#20252b;--cd:#fff;--ln:#d5d9d4;--ac:#1b6a7a;--on:#fff;--mu:#5d6770;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#15191d;--fg:#e8ecef;--cd:#1f252b;--ln:#323a42;--ac:#5bb5c9;--on:#10161a;--mu:#9aa5ae}}
*{box-sizing:inherit}body{margin:0;font:16px/1.45 "Avenir Next",Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 14px calc(76px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
h1{font-size:1.5rem;margin:.9em 0 .4em}h2{font-size:1.3rem;margin:.6em 0 .2em}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:12px;margin:10px 0}.m{color:var(--mu);font-size:.9rem}
button,input,select{font:inherit;color:inherit}button{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:10px 14px;margin:4px 4px 4px 0;min-height:44px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600;display:block;width:100%;margin:10px 0}
label{display:block;margin:8px 0}input{display:block;width:100%;padding:10px;margin-top:4px;background:var(--cd);border:1px solid var(--ln);border-radius:6px}
.big{font-size:4rem;font-weight:700;text-align:center;margin:.3em 0;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;margin:0;background:none}nav button.on{color:var(--ac);font-weight:700}
.ch button.on{background:var(--ac);color:var(--on)}details{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;margin:8px 0}summary{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.88rem;display:block;overflow-x:auto}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
</style></head><body><div id="app"></div><script>
// Fichas: [nombre, grupo, material, pasos[], errores]. Pendientes de contrastar con fuentes especializadas.
const EX={
flex:['Flexiones con asas','Empuje','asas',['Manos con las asas bajo los hombros, brazos rectos y cuerpo en línea recta de cabeza a talones.','Antes de bajar, lleva las escápulas hacia abajo y juntas y mantenlas así durante todo el movimiento.','Baja de forma controlada hasta acercar el pecho a las asas y empuja hasta extender los brazos.'],'Cadera caída o zona lumbar sin soporte (puede provocar dolor). Más fácil: rodillas apoyadas.','ACE Fitness (artículos sobre la flexión)'],
flexpies:['Flexiones con pies elevados','Empuje','asas + apoyo estable',['Pies sobre un apoyo estable, manos en las asas.','Mismo patrón que la flexión normal: cuerpo recto y bajada controlada.'],'Cadera caída o elevada. Sube la altura de los pies poco a poco.'],
press:['Press militar con barra','Hombro','barra',['De pie, pies a la anchura de caderas, barra a la altura de las clavículas, agarre algo más ancho que los hombros.','Glúteos y abdomen firmes; empuja la barra hacia arriba pasando cerca de la cara.','Bloquea arriba con la barra sobre la cabeza y baja controlado.'],'Arquear la zona lumbar, ayudarse con las piernas.'],
remoanillas:['Remo invertido en anillas','Tirón','anillas',['Ajusta las anillas a una altura que te permita mantener el cuerpo recto de cabeza a talones; aprieta glúteos y abdomen.','Empieza el tirón juntando las escápulas, no con los brazos; mantén los codos cerca del cuerpo y sin encoger los hombros.','Lleva las anillas hacia el pecho y baja con control hasta extender del todo los brazos.'],'Cadera caída o en pico, tirar solo con los brazos, abrir mucho los codos, usar impulso. Más fácil: cuerpo más vertical (anillas más altas). Más difícil: cuerpo más horizontal o pies elevados.','Wiki de r/bodyweightfitness y Healthline'],
domi:['Dominadas','Tirón','barra de dominadas (banda opcional)',['Agarre algo más ancho que los hombros, brazos extendidos y escápulas activas.','Sube hasta que la barbilla supere la barra, sin balanceo.','Baja controlado hasta extender los brazos.'],'Balanceo y recorrido incompleto. Una banda elástica puede asistir el movimiento.'],
chin:['Chin-ups (agarre supino)','Tirón','barra de dominadas',['Agarre con las palmas hacia ti, a la anchura de los hombros.','Sube hasta la barbilla sobre la barra y baja controlado.'],'Balanceo, no extender del todo abajo.'],
remobarra:['Remo con barra inclinado','Tirón','barra',['Bisagra de cadera con la espalda neutra y el torso inclinado; barra frente a las piernas.','Tira de la barra hacia la parte baja del abdomen con los codos cerca del cuerpo.','Baja controlado sin perder la postura.'],'Redondear la espalda, impulsarse con el tronco.'],
sfrontal:['Sentadilla frontal con barra','Pierna','barra',['Colocar la barra sobre los hombros sin soportes exige técnica (cargada desde el suelo): pendiente de contrastar con una fuente fiable.','Barra apoyada en la parte delantera de los hombros, codos adelantados y altos, tronco erguido.','Baja controlado con las rodillas siguiendo la línea de los pies y sube empujando el suelo.'],'Codos que caen, tronco que se inclina hacia delante, rodillas hacia dentro. Si pierdes el control, la barra se puede soltar hacia delante.'],
pm:['Peso muerto con barra','Pierna','barra',['Barra en el suelo sobre la mitad del pie, agarre algo más ancho que las piernas, espalda neutra y hombros sobre la barra.','Empuja el suelo con las piernas manteniendo la barra pegada al cuerpo hasta quedar erguido.','Baja con control llevando primero la cadera atrás.'],'Redondear la espalda, tirar con los brazos, separar la barra del cuerpo.'],
bulgara:['Sentadilla búlgara','Pierna','apoyo estable',['Pie trasero apoyado en un asiento estable a la altura de la rodilla, pie delantero adelantado.','Baja con el tronco erguido hasta que el muslo delantero quede cerca de paralelo y sube empujando con el pie delantero.'],'Pie delantero demasiado cerca, rodilla hacia dentro, apoyo inestable. Hazla primero sin peso.'],
curlbarra:['Curl de bíceps con barra','Bíceps','barra',['De pie, agarre con las palmas hacia arriba a la anchura de los hombros, codos pegados al cuerpo.','Sube la barra flexionando los codos sin balancear el tronco y baja controlado.'],'Balanceo del cuerpo, codos que se adelantan.'],
tricanillas:['Extensión de tríceps en anillas','Tríceps','anillas',['Manos en las anillas con el cuerpo inclinado hacia delante y los brazos extendidos.','Flexiona los codos acercando la frente a las manos y extiéndelos de nuevo.'],'Cadera caída, codos muy abiertos. Más fácil: cuerpo más vertical.'],
curlanillas:['Curl de bíceps en anillas','Bíceps','anillas',['Agarra las anillas con las palmas hacia ti y échate hacia atrás con el cuerpo recto.','Flexiona los codos llevando las manos hacia la frente y baja controlado.'],'Cadera caída, codos que se abren. Más fácil: cuerpo más vertical.'],
elevlat:['Elevaciones laterales con banda','Hombro','banda',['Pisa la banda con los pies y agarra los extremos junto a los muslos.','Eleva los brazos hacia los lados hasta la altura de los hombros y baja controlado.'],'Encoger los hombros, balancear el tronco.'],
rdl:['Peso muerto rumano con barra','Pierna','barra',['Empieza de pie con la barra cerca de los muslos, rodillas ligeramente flexionadas, espalda neutra y hombros hacia abajo.','Empuja la cadera hacia atrás (es una bisagra de cadera, no una sentadilla) mientras la barra baja pegada a muslos y piernas.','Baja hasta notar estiramiento en los isquios o hasta media espinilla sin perder la espalda neutra; sube llevando la cadera adelante y apretando los glúteos.'],'Separar la barra del cuerpo, redondear o arquear la espalda, doblar demasiado las rodillas. Sin soportes, recoge la barra del suelo con la técnica del peso muerto (ficha pendiente de contrastar).','Experience Life e ISSA'],
zancadas:['Zancadas con barra','Pierna','barra',['Paso largo hacia delante con el tronco erguido.','Baja con control hasta flexionar ambas rodillas en torno a 90° y empuja para volver.'],'Paso demasiado corto, rodilla delantera hacia dentro, tronco inclinado.'],
hip:['Hip thrust con barra','Glúteo','barra + apoyo estable',['Espalda alta apoyada en una superficie estable, barra sobre la cadera (protegida).','Empuja con los talones extendiendo la cadera hasta alinear tronco y muslos.','Baja con control.'],'Arquear la zona lumbar al final del movimiento.'],
rueda:['Rueda abdominal','Core','rueda',['De rodillas, rueda bajo los hombros, abdomen y glúteos contraídos.','Rueda hacia delante hasta donde mantengas la pelvis firme y vuelve contrayendo el abdomen.'],'Hundir la zona lumbar, ir demasiado lejos. Empieza con poco recorrido.'],
burpees:['Burpees','Acondicionamiento','sin material',['Desde de pie, apoya las manos y lleva los pies atrás hasta la posición de flexión.','Flexión (opcional), vuelve con los pies adelante y salta extendiendo el cuerpo.'],'Cadera caída en la flexión, aterrizaje brusco. Versión suave: sin salto ni flexión.'],
face:['Face pull con banda','Hombro posterior','banda',['Banda anclada a la altura de la cara; tira hacia la cara abriendo los codos.','Junta las escápulas al final y vuelve controlado.'],'Encoger los hombros, tirar echando el cuerpo atrás.'],
plancha:['Plancha abdominal','Core','sin material',['Apoya los antebrazos bajo los hombros y las puntas de los pies; cuerpo en línea recta de cabeza a talones.','Aprieta abdomen y glúteos y respira con normalidad durante todo el tiempo.'],'Cadera caída o en pico, aguantar la respiración. Más fácil: rodillas apoyadas.',null,45],
placad:['Plancha lateral derecha','Core','sin material',['Apoya el antebrazo derecho bajo el hombro y los pies uno sobre otro; eleva la cadera hasta alinear el cuerpo.','Mantén el abdomen firme sin girar el pecho ni hundir la cadera.'],'Cadera caída, rotar el tronco. Más fácil: rodillas flexionadas y apoyadas.',null,45],
placai:['Plancha lateral izquierda','Core','sin material',['Apoya el antebrazo izquierdo bajo el hombro y los pies uno sobre otro; eleva la cadera hasta alinear el cuerpo.','Mantén el abdomen firme sin girar el pecho ni hundir la cadera.'],'Cadera caída, rotar el tronco. Más fácil: rodillas flexionadas y apoyadas.',null,45],
bicho:['Bicho muerto','Core','sin material',['Tumbado boca arriba con los brazos extendidos hacia el techo y caderas y rodillas a 90°.','Baja a la vez un brazo y la pierna contraria sin despegar la zona lumbar del suelo, vuelve y alterna.'],'Arquear la zona lumbar, ir demasiado rápido.',null,45],
perro:['Perro de caza','Core','sin material',['A cuatro apoyos con las manos bajo los hombros y las rodillas bajo las caderas, espalda neutra.','Extiende a la vez un brazo y la pierna contraria sin girar la cadera, vuelve y alterna.'],'Arquear la espalda, girar la cadera, balancearse.',null,45],
puente:['Puente de glúteos','Core','sin material',['Tumbado boca arriba con las rodillas flexionadas y los pies apoyados a la anchura de las caderas.','Eleva la cadera apretando los glúteos hasta alinear hombros, caderas y rodillas y baja con control.'],'Arquear la zona lumbar al subir.',null,45],
escaladores:['Escaladores','Core','sin material',['En plancha alta con las manos bajo los hombros y el cuerpo recto.','Lleva una rodilla hacia el pecho y alterna con la otra sin subir la cadera.'],'Cadera elevada, rebotar sobre las manos.',null,45],
giros:['Giros rusos','Core','sin material',['Sentado con las rodillas flexionadas y el tronco algo inclinado hacia atrás, con la espalda recta.','Gira el tronco hacia un lado y otro llevando las manos de lado a lado.'],'Encorvar la espalda, mover solo los brazos.',null,45],
superman:['Superman','Core','sin material',['Tumbado boca abajo con los brazos extendidos hacia delante.','Eleva a la vez brazos y piernas, mantén un instante y baja controlado.'],'Elevarse demasiado forzando el cuello o la zona lumbar.',null,45]};
// Bloques: x = ejercicios (2 = superserie), s = series, r = repeticiones, d = descanso (s)
const DAYS=[
{n:'Torso A',w:'Lunes',b:[{x:['flex','remoanillas'],s:4,r:'8-12',d:90},{x:['press','chin'],s:4,r:'6-10',d:90},{x:['curlbarra','tricanillas'],s:3,r:'8-12',d:60},{x:['face'],s:3,r:'12-15',d:45}]},
{n:'Pierna',w:'Miércoles',b:[{x:['sfrontal'],s:4,r:'6-10',d:120},{x:['rdl'],s:3,r:'8-10',d:90},{x:['bulgara','rueda'],s:3,r:'8-12',d:75},{x:['hip'],s:3,r:'10-12',d:75},{x:['zancadas'],s:3,r:'8-12',d:45}]},
{n:'Torso B',w:'Viernes',b:[{x:['flexpies','remobarra'],s:4,r:'8-12',d:90},{x:['domi','press'],s:4,r:'5-8',d:90},{x:['elevlat','curlanillas'],s:3,r:'10-15',d:60},{x:['face'],s:3,r:'12-15',d:45}]},
{n:'Cuerpo completo',w:'Domingo',b:[{x:['pm'],s:3,r:'6-8',d:120},{x:['press','remobarra'],s:3,r:'8-10',d:90},{x:['flex','rueda'],s:3,r:'8-12',d:75},{x:['face'],s:3,r:'12-15',d:60},{x:['burpees'],s:4,r:'10',d:45}]}];
const COREU=['plancha',['placad','placai'],'bicho','perro','puente','escaladores','giros','superman'],CORE_EST=['plancha','bicho','perro','puente'];
const BAR=8,INV=[10,10,5,2.5,2.5,1,1];
const $=s=>document.querySelector(s),KEY='fuerza_v1';let D={sessions:[],cur:null};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)D=x}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const Q=(di,c)=>{const o=[];DAYS[di].b.forEach(b=>{for(let k=1;k<=b.s;k++)b.x.forEach((e,j)=>o.push({e,r:b.r,d:j<b.x.length-1?15:b.d,k,s:b.s}))});(c||[]).forEach(e=>o.push({e,r:'45 s',d:15,k:1,s:1,t:45}));return o};
const avgSet=()=>{const a=D.sessions.flatMap(s=>s.sets).map(x=>(Date.parse(x.t1)-Date.parse(x.t0))/1000).filter(x=>x>5&&x<180);return a.length>=10?a.reduce((s,y)=>s+y)/a.length:40};
// Estimación: duración de serie (40 s por defecto, o tu media real con 10+ series) + descansos + 30 s de preparación por bloque + 5 min de calentamiento (supuestos)
const est=di=>{const t=avgSet();return Math.round((Q(di,CORE_EST).reduce((a,q)=>a+(q.t||t)+q.d,0)+30*DAYS[di].b.length+300)/60)};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const last=e=>{for(let i=D.sessions.length-1;i>=0;i--){const s=[...D.sessions[i].sets].reverse().find(x=>x.e==e);if(s)return s}return null};
const ficha=e=>{const x=EX[e];return `<details><summary>${x[0]}</summary><p class=m>${x[1]} · ${x[2]}</p><ol>${x[3].map(p=>`<li>${p}</li>`).join('')}</ol><p><b>Errores frecuentes:</b> ${x[4]}</p><p class=m>${x[5]?'Contrastada con: '+x[5]+'.':'Pendiente de contrastar con fuentes especializadas.'}</p></details>`};
let v='home',ph='ready',T0=0,RT=0,sel=null,hi=null,KG=0,TS0='',TS1='',ac=null,PL=null;
function combos(){const r=new Map(),n=INV.length;for(let m=0;m<3**n;m++){let x=m,L=[],R=[];for(let i=0;i<n;i++){const c=x%3;x=(x-c)/3;if(c==1)L.push(INV[i]);if(c==2)R.push(INV[i])}const a=L.reduce((s,y)=>s+y,0),b=R.reduce((s,y)=>s+y,0);if(a!=b)continue;const t=BAR+a+b,k=L.length+R.length;if(!r.has(t)||r.get(t).k>k)r.set(t,{L,R,k})}return r}
const nav=()=>`<nav>${[['home','Inicio'],['guia','Guía'],['discos','Discos'],['hist','Historial']].map(([k,t])=>`<button class="${v==k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}</nav>`;
function go(k,a){v=k;hi=a;draw()}
function draw(){const f={home:Vhome,guia:Vguia,discos:Vdiscos,hist:Vhist,sess:Vsess,det:Vdet}[v];$('#app').innerHTML=f()+(v=='sess'?'':nav())}
const HOY={1:0,3:1,5:2,0:3}[new Date().getDay()];
const prog=di=>{const b=DAYS[di].b,m=[...new Set(b.flatMap(k=>k.x.map(e=>EX[e][2])))].join(', ');return `<details><summary>Ver programa</summary><ul>${b.map(k=>`<li>${k.x.map(e=>EX[e][0]).join(' + ')}${k.x.length>1?' (superserie)':''}: ${k.s} series × ${k.r} rep, descanso ${k.d} s</li>`).join('')}<li>Core (rotan entre sesiones): 4 ejercicios de 45 s, p. ej. plancha, plancha lateral (ambos lados), bicho muerto, perro de caza, puente de glúteos, escaladores, giros rusos, superman</li></ul><p class=m>Material: ${m}. Tiempo estimado: ${est(di)} min (incluye calentamiento).</p></details>`};
const VER='v3 (2026-11-07)';
const Vhome=()=>`<h1>Fuerza en casa</h1><p class=m>Versión ${VER}</p>${D.cur?`<button class=p onclick="go('sess')">Continuar sesión: ${DAYS[D.cur.day].n}</button>`:''}${DAYS.map((d,i)=>`<div class=c><b>${d.w}: ${d.n}</b>${i===HOY?' <b style="color:var(--ac)">(hoy)</b>':''}<div class=m>Unos ${est(i)} min, ${Q(i,CORE_EST).length} series</div>${prog(i)}<button class=p onclick="start(${i})">Empezar sesión</button></div>`).join('')}`;
async function wl(){try{await navigator.wakeLock.request('screen')}catch(e){}}
function start(i){if(D.cur&&!confirm('Hay una sesión sin terminar. ¿Descartarla?'))return;D.ci=D.ci||0;const cu=[0,1,2,3].map(k=>COREU[(D.ci+k)%COREU.length]).flat();D.ci=(D.ci+4)%COREU.length;D.cur={id:new Date().toISOString(),day:i,sets:[],core:cu};sv();ph='ready';wl();go('sess')}
function Vsess(){const c=D.cur;if(!c){v='home';return Vhome()+nav()}const q=Q(c.day,c.core),i=c.sets.length,top=`<div class=m>${DAYS[c.day].n}: serie ${Math.min(i+1,q.length)} de ${q.length}</div>`;
if(i>=q.length)return top+`<h2>Sesión completada</h2><button class=p onclick=fin()>Guardar sesión</button>`;
const it=q[i],l=last(it.e),x=EX[it.e];let b='';
if(ph=='ready')b=`${it.t?'':`<label>Peso en kg (0 si es peso corporal)<input id=kg type=number inputmode=decimal step=0.5 value="${l?l.kg:0}"></label>`}<button class=p onclick=run()>Empezar serie</button>`;
if(ph=='run')b=`<div id=tm class=big>0:00</div><button class=p onclick=stop()>Terminar serie</button>`;
if(ph=='log')b=`<label>Repeticiones<input id=rp type=number inputmode=numeric></label><label>Esfuerzo (1-10)<input id=rpe type=number inputmode=numeric min=1 max=10></label><button class=p onclick=logset()>Guardar serie</button>`;
if(ph=='rest')b=`<div id=tm class=big>${fmt(q[i-1].d)}</div><div class=m>Descanso. Después: ${x[0]}</div><button onclick=skip()>Saltar descanso</button>`;
return top+`<h2>${x[0]}</h2><p class=m>${it.t?`Core: ${it.t} s`:`Objetivo: ${it.r} repeticiones, serie ${it.k} de ${it.s}${l?`. Última vez: ${l.kg} kg × ${l.r}`:''}`}</p>`+b+ficha(it.e)+`<button onclick=fe()>Terminar sesión</button>`}
function beep(){try{const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),250)}catch(e){}}
function run(){KG=+(($('#kg')||{}).value)||0;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}T0=Date.now();TS0=new Date().toISOString();ph='run';draw()}
function stop(){TS1=new Date().toISOString();const c=D.cur,it=Q(c.day,c.core)[c.sets.length];if(it.t){logset(Math.round((Date.now()-T0)/1000));return}ph='log';draw()}
function logset(auto){const c=D.cur,q=Q(c.day,c.core),i=c.sets.length;c.sets.push({e:q[i].e,t0:TS0,t1:TS1,kg:KG,r:auto!=null?auto:(+$('#rp').value||0),rpe:auto!=null?null:(+$('#rpe').value||null)});sv();if(i+1>=q.length)ph='ready';else{ph='rest';RT=Date.now()+q[i].d*1000}draw()}
function skip(){ph='ready';draw()}
function fin(){const c=D.cur;c.t1=new Date().toISOString();D.sessions.push(c);D.cur=null;sv();go('hist')}
function fe(){if(!D.cur.sets.length){D.cur=null;sv();go('home');return}if(confirm('¿Terminar la sesión ahora?'))fin()}
setInterval(()=>{const e=$('#tm');if(!e)return;if(ph=='run'){const c=D.cur,it=c&&Q(c.day,c.core)[c.sets.length],el=(Date.now()-T0)/1000;if(it&&it.t){e.textContent=fmt(it.t-el);if(el>=it.t){beep();stop()}}else e.textContent=fmt(el)}if(ph=='rest'){const r=(RT-Date.now())/1000;e.textContent=fmt(r);if(r<=0){beep();ph='ready';draw()}}},250);
const Vguia=()=>`<h1>Guía de ejercicios</h1><p class=m>Cada ficha indica si está contrastada con fuentes o sigue pendiente (se redactaron a partir de conocimiento general). Sin soportes para la barra: deja siempre 2-3 repeticiones en reserva y entrena con espacio libre alrededor.</p>${Object.keys(EX).map(ficha).join('')}`;
function Vdiscos(){PL=PL||combos();const ks=[...PL.keys()].sort((a,b)=>a-b),s=sel!=null&&PL.get(sel);return `<h1>Calculadora de discos</h1><p class=m>Barra de ${BAR} kg. Cargas que puedes montar con tus discos manteniendo el mismo peso a cada lado:</p><div class=ch>${ks.map(k=>`<button class="${k==sel?'on':''}" onclick="sel=${k};draw()">${k} kg</button>`).join('')}</div>${s?`<div class=c><b>${sel} kg</b><br>Lado A: ${s.L.join(' + ')||'sin discos'}<br>Lado B: ${s.R.join(' + ')||'sin discos'}</div>`:''}`}
const Vhist=()=>`<h1>Historial</h1>${D.sessions.length?D.sessions.map((s,i)=>[s,i]).reverse().map(([s,i])=>`<div class=c onclick="go('det',${i})"><b>${DAYS[s.day].n}</b><div class=m>${new Date(s.id).toLocaleString('es-ES')}, ${s.sets.length} series${s.fcm?`, FC media ${s.fcm} y máxima ${s.fcx}`:''}</div></div>`).join(''):'<p class=m>Aún no hay sesiones. Empieza una desde Inicio.</p>'}<div class=c><button onclick=exp()>Exportar copia (JSON)</button><label>Importar copia<input type=file accept=.json onchange=impj(event)></label></div>`;
function Vdet(){const s=D.sessions[hi],vol=s.sets.reduce((a,x)=>a+x.kg*x.r,0);return `<h1>${DAYS[s.day].n}</h1><p class=m>${new Date(s.id).toLocaleString('es-ES')}. Duración ${fmt((Date.parse(s.t1)-Date.parse(s.id))/1000)}. Volumen ${vol} kg·rep${s.fcm?`. FC media ${s.fcm}, máxima ${s.fcx}`:''}</p><table><tr><th>Ejercicio<th>kg×rep<th>RPE<th>FC med/máx<th>Rec.</tr>${s.sets.map(x=>`<tr><td>${EX[x.e][0]}<td>${EX[x.e][6]?x.r+' s':x.kg+'×'+x.r}<td>${x.rpe||''}<td>${x.fm?x.fm+'/'+x.fx:''}<td>${x.rec==null?'':x.rec}</tr>`).join('')}</table><p class=m>Rec.: pulsaciones que bajan entre el fin de la serie y el inicio de la siguiente.</p><div class=c><button onclick=etcx()>Exportar TCX</button><div class=m>${s.hr?'Incluye la FC importada de Zepp.':'Sin FC: importa antes el TCX de Zepp para incluirla.'}</div></div><div class=c><label>Importar TCX de Zepp para ver la FC por serie<input type=file onchange=imt(event)></label><div id=msg class=m></div></div><button onclick="go('hist')">Volver</button><button onclick=del()>Borrar sesión</button>`}
function tcx(t){const x=new DOMParser().parseFromString(t,'text/xml'),m=new Map();x.querySelectorAll('Trackpoint').forEach(p=>{const a=p.querySelector('Time'),h=p.querySelector('HeartRateBpm Value');if(!a||!h)return;const k=Math.floor(Date.parse(a.textContent)/1000),l=m.get(k)||[];l.push(+h.textContent);m.set(k,l)});return[...m].map(([k,a])=>[k,a.reduce((s,y)=>s+y)/a.length]).sort((a,b)=>a[0]-b[0])}
function imt(ev){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{const p=tcx(t),s=D.sessions[hi],avg=w=>Math.round(w.reduce((u,y)=>u+y)/w.length),
hr=ts=>{const k=Date.parse(ts)/1000;let b=null;for(const q of p)if(Math.abs(q[0]-k)<=5&&(!b||Math.abs(q[0]-k)<Math.abs(b[0]-k)))b=q;return b?b[1]:null};let n=0;
s.sets.forEach((x,i)=>{const a=Date.parse(x.t0)/1000,z=Date.parse(x.t1)/1000,w=p.filter(q=>q[0]>=a&&q[0]<=z).map(q=>q[1]);if(w.length){n++;x.fm=avg(w);x.fx=Math.round(Math.max(...w))}else{delete x.fm;delete x.fx}
const nx=s.sets[i+1],h1=hr(x.t1),h2=nx?hr(nx.t0):null;x.rec=h1!=null&&h2!=null?Math.round(h1-h2):null});
const all=p.filter(q=>q[0]>=Date.parse(s.id)/1000&&q[0]<=Date.parse(s.t1)/1000).map(q=>q[1]);const b0=Math.floor(Date.parse(s.id)/1000),b1=Math.ceil(Date.parse(s.t1)/1000);s.hr=Array(b1-b0+1).fill(0);p.forEach(q=>{if(q[0]>=b0&&q[0]<=b1)s.hr[q[0]-b0]=Math.round(q[1])});
if(all.length){s.fcm=avg(all);s.fcx=Math.round(Math.max(...all))}
const lc=t=>new Date(t*1000).toLocaleString('es-ES'),rg=p.length?`El archivo cubre de ${lc(p[0][0])} a ${lc(p[p.length-1][0])} y la sesión, de ${lc(b0)} a ${lc(b1)}.`:'';sv();draw();$('#msg').textContent=!p.length?'El archivo se ha leído, pero no contiene datos de frecuencia cardiaca. ¿Es un TCX de Zepp?':n?`FC asignada a ${n} de ${s.sets.length} series.`:'Ninguna serie coincide en hora con el archivo. '+rg}).catch(e=>{$('#msg').textContent='No se pudo leer el archivo: '+(e&&e.message||e)})}
function etcx(){const s=D.sessions[hi],b0=Math.floor(Date.parse(s.id)/1000),z=t=>new Date(t*1000).toISOString().replace(/\.\d+Z$/,'Z'),x=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'),sec=ts=>Math.round(Date.parse(ts)/1000);
const hv=t=>s.hr&&s.hr[t-b0]>0?s.hr[t-b0]:null;
const lap=(a,b,int,note)=>{if(b<=a)return'';const v=[];for(let t=a;t<=b;t++){const h=hv(t);if(h)v.push([t,h])}
return `<Lap StartTime="${z(a)}"><TotalTimeSeconds>${b-a}</TotalTimeSeconds><Calories>0</Calories>${v.length?`<AverageHeartRateBpm><Value>${Math.round(v.reduce((u,y)=>u+y[1],0)/v.length)}</Value></AverageHeartRateBpm><MaximumHeartRateBpm><Value>${Math.max(...v.map(y=>y[1]))}</Value></MaximumHeartRateBpm>`:''}<Intensity>${int}</Intensity><TriggerMethod>Manual</TriggerMethod>${v.length?`<Track>${v.map(y=>`<Trackpoint><Time>${z(y[0])}</Time><HeartRateBpm><Value>${y[1]}</Value></HeartRateBpm></Trackpoint>`).join('')}</Track>`:''}<Notes>${x(note)}</Notes></Lap>`};
let L='',c=b0;const e=sec(s.t1);
s.sets.forEach((q,i)=>{const a=sec(q.t0),b=sec(q.t1);L+=lap(c,a,i?'Resting':'Active',i?'Descanso':'Antes de la primera serie');L+=lap(a,b,'Active',EX[q.e][6]?`${EX[q.e][0]}: ${q.r} s`:`${EX[q.e][0]}: ${q.kg} kg x ${q.r}${q.rpe?', esfuerzo '+q.rpe:''}`);c=b});
L+=lap(c,e,'Resting','Final');
const o=`<?xml version="1.0" encoding="UTF-8"?>\n<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2"><Activities><Activity Sport="Other"><Id>${z(b0)}</Id>${L}<Notes>Entrenamiento de fuerza: ${x(DAYS[s.day].n)}</Notes><Creator xsi:type="Application_t" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><Name>Fuerza en casa</Name></Creator></Activity></Activities></TrainingCenterDatabase>`;
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'application/vnd.garmin.tcx+xml'}));a.download='fuerza-'+z(b0).slice(0,10)+'.tcx';a.click()}
function del(){const s=D.sessions[hi];if(confirm(`¿Borrar la sesión "${DAYS[s.day].n}" del ${new Date(s.id).toLocaleString('es-ES')}? No se puede deshacer.`)){D.sessions.splice(hi,1);sv();go('hist')}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='fuerza-casa-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function impj(ev){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(!Array.isArray(x.sessions))throw 0;if(confirm('Se reemplazará el historial actual por la copia. ¿Continuar?')){D=x;sv();draw()}}catch(e){alert('El archivo no es una copia válida.')}})}
if('serviceWorker' in navigator){if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());navigator.serviceWorker.register('sw.js').catch(()=>{})}
draw();
</script></body></html>
